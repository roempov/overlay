<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Text Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --text:#0a0acc; --box-top:#ffffff; --box-bottom:#efefef; }
  html, body { margin:0; height:100%; background:transparent; }
  body { font-family:'Battambang','Khmer OS Battambang','Noto Sans Khmer',sans-serif; }
  body.preview { background:linear-gradient(135deg,#78b9cf 0%,#8ccbe4 20%,#a3c4ee 60%,#c4bdf8 100%); }
  .stage { position:absolute; left:50%; top:36%; transform:translate(-50%,-50%); }
  .box {
    background:linear-gradient(var(--box-top),var(--box-bottom));
    color:var(--text);
    font-size:34px; line-height:1.4; white-space:nowrap;
    padding:8px 18px; border-radius:8px;
    box-shadow:0 2px 8px rgba(0,0,0,.18);
    animation:pop .5s ease-out both;
  }
  @keyframes pop { from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none} }
</style>
</head>
<body>
<div class="stage"><div class="box" id="msg">បងៗនៅខេត្ត សូមជួយវេរលុយមុន</div></div>
<script>
  // Open this page with #preview to see it on a gradient background.
  // For OBS / streaming, use the plain link: the background is transparent.
  if (location.hash === '#preview') document.body.classList.add('preview');
  addEventListener('hashchange', function(){
    document.body.classList.toggle('preview', location.hash === '#preview');
  });
</script>
</body>
</html>
